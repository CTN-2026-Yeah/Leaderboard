<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTN Leaderboard Tracker</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --border: #e3e3e0;
    --up: #138a43; --down: #c62828; --mine: #fff4c2; --hover: #f0f0ec; --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa2; --border: #303035;
      --up: #4cc77f; --down: #ff6b6b; --mine: #3a3418; --hover: #26262a; --accent: #8ea2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .chart-wrap { position: relative; height: 340px; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type=search] { flex: 1; min-width: 180px; padding: 8px 10px; border: 1px solid var(--border);
                       border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--card); cursor: pointer; user-select: none; font-weight: 600; }
  th.sorted::after { content: attr(data-dir); color: var(--muted); margin-left: 4px; }
  td.l, th.l { text-align: left; }
  td.uni { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tr.mine { background: var(--mine); }
  tr.charted td:nth-child(3) { box-shadow: inset 3px 0 0 var(--accent); }
  .up { color: var(--up); } .down { color: var(--down); } .zero { color: var(--muted); }
  td a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
  td a:hover { color: var(--accent); text-decoration-color: currentColor; }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .detail-head h2 { margin: 0; font-size: 20px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0 16px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button, .btn { border: 0; background: var(--card); color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: #fff; }
  .btn { border: 1px solid var(--border); border-radius: 6px; }
  .history { max-height: 420px; overflow-y: auto; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>CTN Leaderboard Tracker</h1>
  <p class="sub" id="sub">Loading…</p>

  <div class="card" id="detail" hidden>
    <div class="detail-head">
      <div>
        <h2 id="d-name"></h2>
        <div class="sub" id="d-meta" style="margin:2px 0 0"></div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <div class="seg" id="d-range">
          <button data-h="24">24h</button><button data-h="72">3d</button><button data-h="168">7d</button><button data-h="0">All</button>
        </div>
        <button class="btn" id="d-close">✕ Close</button>
      </div>
    </div>
    <div class="stats" id="d-stats"></div>
    <div class="chart-wrap"><canvas id="d-chart"></canvas></div>
    <div class="history scroll">
      <table>
        <thead><tr>
          <th class="l">Time</th><th>Score</th><th title="Change since previous snapshot">Δ</th>
          <th title="Points per hour since previous snapshot">pts/h</th><th>Rank</th><th>Δ rank</th>
        </tr></thead>
        <tbody id="d-rows"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <p class="hint">Shows the top 8 teams and your team. Click a row in the table to add or remove that team.</p>
  </div>

  <div class="card">
    <div class="controls">
      <input type="search" id="search" placeholder="Filter by team or university…">
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-key="rank">#</th>
          <th data-key="rankChange" title="Rank change over the last 24h">Δ rank</th>
          <th data-key="name" class="l">Team</th>
          <th data-key="uni" class="l">University</th>
          <th data-key="score">Score</th>
          <th data-key="d1" title="Change since ~1 hour ago">Δ 1h</th>
          <th data-key="d6" title="Change since ~6 hours ago">Δ 6h</th>
          <th data-key="d24" title="Change since ~24 hours ago">Δ 24h</th>
          <th data-key="rate" title="Average points per hour over the last 24h">pts/h</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="data/history.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const MY_TEAM = "Yeah";
const TOLERANCE_MS = 15 * 60 * 1000; // snapshots land a little after the hour

const H = window.HISTORY || { teams: {}, snapshots: [] };
const snaps = H.snapshots.map(s => ({ ...s, ms: Date.parse(s.t) }));
const latest = snaps[snaps.length - 1];

const fmtTime = ms => new Date(ms).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
const fmtDelta = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toLocaleString();
const cls = v => v == null || v === 0 ? "zero" : v > 0 ? "up" : "down";

// Latest snapshot taken at least `hours` before the newest one (falls back to the oldest).
function snapshotAgo(hours) {
  const target = latest.ms - hours * 3600e3 + TOLERANCE_MS;
  let best = null;
  for (const s of snaps) if (s.ms <= target && s !== latest) best = s;
  return best || (snaps.length > 1 ? snaps[0] : null);
}

// Standard competition ranking: 1 + number of teams with a strictly higher score.
function ranks(scores) {
  const firstIndex = new Map();
  Object.values(scores).sort((a, b) => b - a).forEach((v, i) => firstIndex.has(v) || firstIndex.set(v, i));
  const out = {};
  for (const [n, v] of Object.entries(scores)) out[n] = firstIndex.get(v) + 1;
  return out;
}

let rows = [], sortKey = "rank", sortDir = 1, charted = new Set(), chart;

function build() {
  if (!latest) { document.getElementById("sub").textContent = "No data yet — run scrape.py."; return; }
  const s1 = snapshotAgo(1), s6 = snapshotAgo(6), s24 = snapshotAgo(24);
  const nowRanks = ranks(latest.scores), oldRanks = s24 ? ranks(s24.scores) : null;
  const delta = (s, n) => s && n in s.scores ? latest.scores[n] - s.scores[n] : null;
  const rateHours = s24 ? (latest.ms - s24.ms) / 3600e3 : 0;

  rows = Object.entries(latest.scores).map(([name, score]) => {
    const d24 = delta(s24, name);
    return {
      name, score, uni: (H.teams[name] || {}).uni || "",
      rank: nowRanks[name],
      rankChange: oldRanks && name in oldRanks ? oldRanks[name] - nowRanks[name] : null,
      d1: delta(s1, name), d6: delta(s6, name), d24,
      rate: d24 != null && rateHours > 0 ? Math.round(d24 / rateHours) : null,
    };
  });

  const checked = H.checked_at ? ` · last checked ${fmtTime(Date.parse(H.checked_at))}` : "";
  document.getElementById("sub").textContent =
    `${rows.length} teams · ${snaps.length} snapshots since ${fmtTime(snaps[0].ms)} · latest update ${fmtTime(latest.ms)}${checked}`;

  [...rows].sort((a, b) => a.rank - b.rank).slice(0, 8).forEach(r => charted.add(r.name));
  if (MY_TEAM in latest.scores) charted.add(MY_TEAM);
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = rows
    .filter(r => !q || r.name.toLowerCase().includes(q) || r.uni.toLowerCase().includes(q))
    .sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
    });

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rc = v => v == null ? "—" : v > 0 ? `▲ ${v}` : v < 0 ? `▼ ${-v}` : "–";
  document.getElementById("rows").innerHTML = list.map(r => `
    <tr data-name="${esc(r.name)}" class="${r.name === MY_TEAM ? "mine" : ""} ${charted.has(r.name) ? "charted" : ""}">
      <td>${r.rank}</td>
      <td class="${cls(r.rankChange)}">${rc(r.rankChange)}</td>
      <td class="l"><a href="#team=${encodeURIComponent(r.name)}" title="Show full history">${esc(r.name)}</a></td>
      <td class="l uni" title="${esc(r.uni)}">${esc(r.uni)}</td>
      <td>${r.score.toLocaleString()}</td>
      <td class="${cls(r.d1)}">${fmtDelta(r.d1)}</td>
      <td class="${cls(r.d6)}">${fmtDelta(r.d6)}</td>
      <td class="${cls(r.d24)}">${fmtDelta(r.d24)}</td>
      <td class="${cls(r.rate)}">${r.rate == null ? "—" : r.rate.toLocaleString()}</td>
    </tr>`).join("");

  document.querySelectorAll("th[data-key]").forEach(th => {
    th.classList.toggle("sorted", th.dataset.key === sortKey);
    th.dataset.dir = sortDir === 1 ? "▲" : "▼";
  });
}

const PALETTE = ["#3b5bdb", "#e8590c", "#2f9e44", "#c2255c", "#7048e8", "#1098ad", "#f08c00", "#5c940d", "#d6336c", "#495057"];

function drawChart() {
  if (!window.Chart || !latest) return;
  const names = [...charted].sort((a, b) => latest.scores[b] - latest.scores[a]);
  const datasets = names.map((n, i) => ({
    label: n,
    data: snaps.map(s => s.scores[n] ?? null),
    borderColor: n === MY_TEAM ? "#f59f00" : PALETTE[i % PALETTE.length],
    backgroundColor: "transparent",
    borderWidth: n === MY_TEAM ? 3 : 2,
    pointRadius: snaps.length > 48 ? 0 : 2,
    tension: 0.2,
  }));
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted");
  const grid = getComputedStyle(document.documentElement).getPropertyValue("--border");
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels: snaps.map(s => fmtTime(s.ms)), datasets },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { color: muted, boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: muted, maxTicksLimit: 10 }, grid: { color: grid } },
        y: { ticks: { color: muted }, grid: { color: grid } },
      },
    },
  });
}

const rankCache = new Map();
const rankAt = s => rankCache.get(s) || rankCache.set(s, ranks(s.scores)).get(s);
const fmtDate = ms => new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
let detailHours = 0, detailChart; // 0 = all history

// Every snapshot for one team, with change vs the previous snapshot.
function teamHistory(name) {
  const all = snaps.filter(s => name in s.scores);
  return all.map((s, i) => {
    const prev = all[i - 1], score = s.scores[name], rank = rankAt(s)[name];
    const hours = prev ? (s.ms - prev.ms) / 3600e3 : 0;
    return {
      ms: s.ms, score, rank,
      d: prev ? score - prev.scores[name] : null,
      rate: prev && hours > 0 ? Math.round((score - prev.scores[name]) / hours) : null,
      dRank: prev ? rankAt(prev)[name] - rank : null,
    };
  });
}

function showDetail() {
  const card = document.getElementById("detail");
  const m = location.hash.match(/^#team=(.+)$/);
  const name = m ? decodeURIComponent(m[1]) : null;
  if (!name || !latest || !(name in latest.scores)) { card.hidden = true; return; }

  const wasHidden = card.hidden;
  card.hidden = false;
  const info = H.teams[name] || {};
  document.getElementById("d-name").textContent = name;
  document.getElementById("d-meta").textContent =
    [info.uni, info.members ? `${info.members} member${info.members > 1 ? "s" : ""}` : ""].filter(Boolean).join(" · ");
  document.querySelectorAll("#d-range button").forEach(b => b.classList.toggle("on", +b.dataset.h === detailHours));

  const hist = teamHistory(name);
  const from = detailHours ? latest.ms - detailHours * 3600e3 - TOLERANCE_MS : -Infinity;
  const view = hist.filter(e => e.ms >= from);
  const first = view[0], last = view[view.length - 1];
  const spanH = (last.ms - first.ms) / 3600e3;
  const gained = last.score - first.score;
  const best = Math.min(...view.map(e => e.rank)), worst = Math.max(...view.map(e => e.rank));
  const stat = (v, label, c = "") => `<div class="stat"><b class="${c}">${v}</b><span>${label}</span></div>`;
  document.getElementById("d-stats").innerHTML =
    stat(last.score.toLocaleString(), "Score") +
    stat(`#${last.rank}`, "Rank now") +
    stat(view.length > 1 ? fmtDelta(gained) : "—", `Gained since ${fmtDate(first.ms)}`, cls(view.length > 1 ? gained : null)) +
    stat(spanH > 0 ? Math.round(gained / spanH).toLocaleString() : "—", "Avg pts/h in range") +
    stat(`#${best} – #${worst}`, "Best – worst rank in range");

  const rc = v => v == null ? "—" : v > 0 ? `▲ ${v}` : v < 0 ? `▼ ${-v}` : "–";
  document.getElementById("d-rows").innerHTML = [...view].reverse().map(e => `
    <tr>
      <td class="l">${fmtDate(e.ms)}</td>
      <td>${e.score.toLocaleString()}</td>
      <td class="${cls(e.d)}">${fmtDelta(e.d)}</td>
      <td class="${cls(e.rate)}">${e.rate == null ? "—" : e.rate.toLocaleString()}</td>
      <td>${e.rank}</td>
      <td class="${cls(e.dRank)}">${rc(e.dRank)}</td>
    </tr>`).join("");

  drawDetailChart(name, view);
  if (wasHidden) card.scrollIntoView({ behavior: "smooth", block: "start" });
}

function drawDetailChart(name, view) {
  if (!window.Chart) return;
  const css = getComputedStyle(document.documentElement);
  const muted = css.getPropertyValue("--muted"), grid = css.getPropertyValue("--border");
  if (detailChart) detailChart.destroy();
  detailChart = new Chart(document.getElementById("d-chart"), {
    type: "line",
    data: {
      labels: view.map(e => fmtDate(e.ms)),
      datasets: [
        { label: "Score", data: view.map(e => e.score), yAxisID: "y", borderColor: "#3b5bdb",
          backgroundColor: "transparent", borderWidth: 2, pointRadius: view.length > 72 ? 0 : 2, tension: 0.2 },
        { label: "Rank", data: view.map(e => e.rank), yAxisID: "y1", borderColor: "#f59f00",
          backgroundColor: "transparent", borderWidth: 2, borderDash: [5, 4], pointRadius: 0, stepped: true },
      ],
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { color: muted, boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: muted, maxTicksLimit: 10 }, grid: { color: grid } },
        y: { position: "left", title: { display: true, text: "Score", color: muted }, ticks: { color: muted }, grid: { color: grid } },
        y1: { position: "right", reverse: true, title: { display: true, text: "Rank", color: muted },
              ticks: { color: muted, precision: 0 }, grid: { display: false } },
      },
    },
  });
}

document.getElementById("d-range").addEventListener("click", e => {
  const h = e.target.closest("button")?.dataset.h;
  if (h == null) return;
  detailHours = +h;
  showDetail();
});
document.getElementById("d-close").addEventListener("click", () => {
  history.pushState(null, "", location.pathname + location.search);
  showDetail();
});
window.addEventListener("hashchange", showDetail);

document.getElementById("rows").closest("table").querySelector("thead").addEventListener("click", e => {
  const key = e.target.closest("th")?.dataset.key;
  if (!key) return;
  if (key === sortKey) sortDir = -sortDir;
  else { sortKey = key; sortDir = ["name", "uni", "rank"].includes(key) ? 1 : -1; }
  render();
});
document.getElementById("rows").addEventListener("click", e => {
  if (e.target.closest("a")) return; // team links open the history view instead
  const name = e.target.closest("tr")?.dataset.name;
  if (!name) return;
  charted.has(name) ? charted.delete(name) : charted.add(name);
  render(); drawChart();
});
document.getElementById("search").addEventListener("input", render);

build(); render(); drawChart(); showDetail();
</script>
</body>
</html>
