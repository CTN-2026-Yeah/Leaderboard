name: Scrape leaderboard

on:
  schedule:
    # Off the busy :00/:15 marks, where GitHub most often delays or drops scheduled runs
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scrape
        id: scrape
        env:
          CTN_EMAIL: ${{ secrets.CTN_EMAIL }}
          CTN_PASSWORD: ${{ secrets.CTN_PASSWORD }}
        run: python3 scrape.py
      - name: Commit new snapshot
        if: steps.scrape.outputs.new_snapshot == 'true'
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add data/history.json data/history.js
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            echo "::error::Push was refused. In the organisation's Settings > Actions > General, set Workflow permissions to 'Read and write'."
            exit 1
          fi
