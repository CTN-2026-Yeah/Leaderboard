name: Scrape leaderboard

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay runs by a few minutes; only changed scores get committed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape
        env:
          CTN_EMAIL: ${{ secrets.CTN_EMAIL }}
          CTN_PASSWORD: ${{ secrets.CTN_PASSWORD }}
        run: python scrape.py
      - name: Commit new snapshot
        run: |
          # checked_at changes every run; only commit when a new snapshot was added
          if git diff --quiet; then exit 0; fi
          old=$(git show HEAD:data/history.json 2>/dev/null | python -c "import json,sys; print(len(json.load(sys.stdin)['snapshots']))" || echo 0)
          new=$(python -c "import json; print(len(json.load(open('data/history.json'))['snapshots']))")
          if [ "$old" = "$new" ]; then exit 0; fi
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add data/
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
